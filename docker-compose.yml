version: '3.8'

# ============================================================================
# Docker Compose - Büyük Veri Pipeline Altyapısı
# Mimarı: Zookeeper + Kafka + Spark Master/Worker + Python Producer
# Performans Notu: Bitnami imajları lightweight ve üretim-hazır
# ============================================================================

services:
  # =========================================================================
  # ZooKeeper - Kafka'nın merkezi koordinasyon servisi
  # =========================================================================
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: big_data_zookeeper
    environment:
      # İzin verilen istemci sayısı (high throughput için artırılmış)
      ZOO_MAX_CLIENT_CNXNS: 200
      ZOO_SERVERS: server.1=zookeeper:2888:3888;zookeeper:2181
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"  # ZooKeeper client port
      - "2888:2888"  # Peer communication
      - "3888:3888"  # Leader election
    networks:
      - big_data_network
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - zk_data:/bitnami/zookeeper/data
      - zk_datalog:/bitnami/zookeeper/datalog

  # =========================================================================
  # Apache Kafka - Mesaj akış platformu (High Throughput optimized)
  # =========================================================================
  kafka:
    image: bitnami/kafka:latest
    container_name: big_data_kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      # Broker konfigürasyonu
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # Performance tuning - 55GB dataset için optimize (increased from 23GB)
      KAFKA_CFG_LOG_SEGMENT_BYTES: 2147483648  # 2GB segments (increased from 1GB)
      KAFKA_CFG_LOG_RETENTION_HOURS: 240  # 10 gün (increased from 7 for large dataset)
      KAFKA_CFG_NUM_NETWORK_THREADS: 16  # Doubled from 8
      KAFKA_CFG_NUM_IO_THREADS: 16  # Doubled from 8
      KAFKA_CFG_SOCKET_SEND_BUFFER_BYTES: 262144  # 256KB (increased from 100KB)
      KAFKA_CFG_SOCKET_RECEIVE_BUFFER_BYTES: 262144  # 256KB (increased from 100KB)
      KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES: 209715200  # 200MB (doubled from 100MB)
      
      # Replication ve durability
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_MIN_INSYNC_REPLICAS: 1
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"   # Dış erişim
      - "29092:29092" # İç iletişim (Docker ağında)
    networks:
      - big_data_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - kafka_data:/bitnami/kafka/data

  # =========================================================================
  # Apache Spark Master - Cluster yöneticisi
  # =========================================================================
  spark-master:
    image: bitnami/spark:latest
    container_name: big_data_spark_master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master port
      - "4040:4040"   # Spark Application UI
    networks:
      - big_data_network
    volumes:
      - spark_master_data:/bitnami/spark
      - ./spark-config:/opt/spark-config:ro
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080

  # =========================================================================
  # Spark Worker 1 - İlk çalışan node
  # =========================================================================
  spark-worker-1:
    image: bitnami/spark:latest
    container_name: big_data_spark_worker_1
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_CORES: 4  # CPU core sayısı
      SPARK_WORKER_MEMORY: 6G  # Increased from 4G for 55GB dataset
    ports:
      - "8081:8081"  # Worker UI
    depends_on:
      - spark-master
    networks:
      - big_data_network
    volumes:
      - spark_worker_1_data:/bitnami/spark
      - ./data:/data:ro
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081

  # =========================================================================
  # Spark Worker 2 - İkinci çalışan node
  # =========================================================================
  spark-worker-2:
    image: bitnami/spark:latest
    container_name: big_data_spark_worker_2
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8082
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 6G  # Increased from 4G for 55GB dataset
    ports:
      - "8082:8082"
    depends_on:
      - spark-master
    networks:
      - big_data_network
    volumes:
      - spark_worker_2_data:/bitnami/spark
      - ./data:/data:ro
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8082

  # =========================================================================
  # Python Producer - Kafka'ya veri gönderen konteyner
  # =========================================================================
  python-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: big_data_producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPIC: amazon_reviews
      DATA_FILE: /data/amazon_reviews_us_Mobile_Electronics_v1_00.tsv
      CHUNK_SIZE: 50000  # 55GB için optimized (was 10000)
      BATCH_DELAY: 0.5   # Faster throughput (was 1.0)
      KAFKA_ACKS: all
      KAFKA_RETRIES: 3
    networks:
      - big_data_network
    volumes:
      - ./data:/data:ro
      - ./kafka_producer.py:/app/kafka_producer.py:ro
    command: python /app/kafka_producer.py

# =========================================================================
# Volumes - Veri persistence
# =========================================================================
volumes:
  zk_data:
    driver: local
  zk_datalog:
    driver: local
  kafka_data:
    driver: local
  spark_master_data:
    driver: local
  spark_worker_1_data:
    driver: local
  spark_worker_2_data:
    driver: local

# =========================================================================
# Networks - Konteyner iletişimi
# =========================================================================
networks:
  big_data_network:
    driver: bridge
