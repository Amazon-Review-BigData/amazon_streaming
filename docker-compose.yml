# ============================================================================
# Docker Compose - Büyük Veri Pipeline Altyapısı
# Mimarı: Zookeeper + Kafka + Spark Master/Worker + Python Producer
# Performans Notu: Bitnami imajları lightweight ve üretim-hazır
# ============================================================================

version: '3.8'

services:
  # =========================================================================
  # ZooKeeper - Kafka'nın merkezi koordinasyon servisi
  # =========================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: big_data_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"  # ZooKeeper client port
      - "2888:2888"  # Peer communication
      - "3888:3888"  # Leader election
    networks:
      - big_data_network
    volumes:
      - zk_data:/var/lib/zookeeper/data
      - zk_datalog:/var/lib/zookeeper/log

  # =========================================================================
  # Apache Kafka - Mesaj akış platformu (High Throughput optimized)
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: big_data_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://big_data_kafka:29092,PLAINTEXT_HOST://localhost:9092  
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 536870912
      KAFKA_REPLICA_FETCH_MAX_BYTES: 536870912
    ports:
      - "9092:9092"   # Dış erişim
      - "29092:29092" # İç iletişim (Docker ağında)
    networks:
      - big_data_network
    volumes:
      - kafka_data:/var/lib/kafka/data

  # =========================================================================
  # Apache Spark Master - Cluster yöneticisi
  # =========================================================================
  spark-master:
    image: docker.io/library/spark:3.5.0
    container_name: big_data_spark_master
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8080:8080"   # Spark Master UI
      - "7077:7077"   # Spark Master port
      - "4040:4040"   # Spark Application UI
    networks:
      - big_data_network
    volumes:
      #- spark_master_data:/opt/spark/work
      - ./spark:/opt/spark-apps
      - ./data:/data
      - ./spark/output:/spark/output # EKLENDİ
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master
      --port 7077
      --webui-port 8080

  # =========================================================================
  # Spark Worker 1 - İlk çalışan node
  # =========================================================================
  spark-worker-1:
    image: docker.io/library/spark:3.5.0
    container_name: big_data_spark_worker_1
    user: root # EKLENDİ
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_WORKER_CORES: 4  # CPU core sayısı
      SPARK_WORKER_MEMORY: 6G  
    ports:
      - "8081:8081"  # Worker UI
    depends_on:
      - spark-master
    networks:
      - big_data_network
    volumes:
      #- spark_worker_1_data:/opt/spark/work
      - ./data:/data
      - ./spark:/opt/spark-apps
      - ./spark/output:/spark/output # EKLENDİ
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081

  # =========================================================================
  # Spark Worker 2 - İkinci çalışan node
  # =========================================================================
  spark-worker-2:
    image: docker.io/library/spark:3.5.0
    container_name: big_data_spark_worker_2
    user: root # EKLENDİ
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_WEBUI_PORT: 8082
      SPARK_WORKER_CORES: 4
      SPARK_WORKER_MEMORY: 6G  
    ports:
      - "8082:8082"
    depends_on:
      - spark-master
    networks:
      - big_data_network
    volumes:
      - ./spark:/opt/spark-apps
      #- spark_worker_2_data:/opt/spark/work
      - ./data:/data
      - ./spark/output:/spark/output # EKLENDİ
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8082

  # =========================================================================
  # Python Producer - Kafka'ya veri gönderen konteyner
  # =========================================================================
  python-producer:
    build:
      context: .
      dockerfile: Dockerfile.producer
    container_name: big_data_producer
    depends_on:
      - kafka
    environment:
      KAFKA_BROKERS: big_data_kafka:29092
      KAFKA_TOPIC: amazon_reviews
      DATA_FILE: /data/amazon_reviews_us_Mobile_Electronics_v1_00.tsv
      CHUNK_SIZE: 50000  
      BATCH_DELAY: 0.5
    networks:
      - big_data_network
    volumes:
      - ./data:/data:ro
      - ./kafka_producer.py:/app/kafka_producer.py:ro
    command: python /app/kafka_producer.py

  # =========================================================================
  # Jupyter Notebook - Sunum ve Görselleştirme İçin (İçinde Pandas/Seaborn var)
  # =========================================================================
  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: big_data_jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=sunum123  # Sunum sırasında gireceğimiz şifre
    volumes:
      - ./spark:/home/jovyan/work  # Projedeki spark klasörünü Jupyter'e bağlıyoruz
    networks:
      - big_data_network

# =========================================================================
# Volumes - Veri persistence
# =========================================================================
volumes:
  zk_data:
    driver: local
  zk_datalog:
    driver: local
  kafka_data:
    driver: local
  spark_master_data:
    driver: local
  spark_worker_1_data:
    driver: local
  spark_worker_2_data:
    driver: local



# =========================================================================
# Networks - Konteyner iletişimi
# =========================================================================
networks:
  big_data_network:
    driver: bridge